[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brokenvault"
version = "1.0.0"
description = "Deduplicating, resumable, verifiable folder backup (client and server)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bv = "brokenvault.client.cli:main"
bv-server = "brokenvault.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: large dataset test, excluded from the default run (use: pytest -m slow)"]
